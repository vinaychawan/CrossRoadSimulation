<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crossroads Sim</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }
  #sidebar { width: 320px; min-width: 260px; padding: 12px; background: #16213e; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
  canvas { background: #0f3460; border-radius: 8px; }
  h2 { font-size: 14px; color: #a0c4ff; border-bottom: 1px solid #2a2a5e; padding-bottom: 4px; }
  button { background: #0f3460; color: #e0e0e0; border: 1px solid #4a90d9; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  button:hover { background: #1a5276; }
  button.danger { border-color: #e74c3c; }
  button.danger:hover { background: #922b21; }
  select, input[type=range], input[type=number] { background: #0f3460; color: #e0e0e0; border: 1px solid #4a90d9; border-radius: 4px; padding: 4px; font-size: 12px; width: 100%; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .label { font-size: 11px; color: #90a4ae; min-width: 90px; }
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .kpi-item { background: #0f3460; border-radius: 4px; padding: 6px; font-size: 11px; }
  .kpi-val { font-size: 16px; color: #4fc3f7; font-weight: bold; }
  #log { font-size: 10px; max-height: 120px; overflow-y: auto; background: #0a0a1a; padding: 6px; border-radius: 4px; }
  #log .safety { color: #e74c3c; }
  #status { font-size: 11px; color: #4caf50; }
  #status.stopped { color: #e74c3c; }
</style>
</head>
<body>
<div id="sidebar">
  <div><h2>🚦 Crossroads Sim</h2><div id="status" class="stopped">● Disconnected</div></div>
  <div><h2>Controls</h2><div class="row" style="gap:4px">
    <button id="btn-create">Create</button><button id="btn-start">▶ Start</button>
    <button id="btn-stop">■ Stop</button><button id="btn-reset" class="danger">⟳ Reset</button>
  </div></div>
  <div><h2>Configuration</h2>
    <div class="row"><span class="label">Algorithm</span><select id="sel-algo"></select></div>
    <div class="row" style="margin-top:6px"><span class="label">Seed</span><input type="number" id="inp-seed" value="42" min="0" style="width:80px"/></div>
    <div class="row" style="margin-top:6px"><span class="label">Max Ticks</span><input type="number" id="inp-maxticks" value="" placeholder="∞" min="1" style="width:80px"/></div>
    <div class="row" style="margin-top:6px"><button id="btn-switch">Switch Algorithm</button></div>
  </div>
  <div><h2>Speed</h2><input type="range" id="slider-speed" min="50" max="2000" value="200" step="50"/><div id="speed-label" style="font-size:11px;color:#90a4ae">200ms / tick</div></div>
  <div><h2>KPIs</h2><div class="kpi-grid">
    <div class="kpi-item"><div class="label">Tick</div><div class="kpi-val" id="kpi-tick">–</div></div>
    <div class="kpi-item"><div class="label">Passed</div><div class="kpi-val" id="kpi-passed">–</div></div>
    <div class="kpi-item"><div class="label">Avg Wait</div><div class="kpi-val" id="kpi-avgwait">–</div></div>
    <div class="kpi-item"><div class="label">Throughput</div><div class="kpi-val" id="kpi-thr">–</div></div>
    <div class="kpi-item"><div class="label">Queue N</div><div class="kpi-val" id="kpi-qN">–</div></div>
    <div class="kpi-item"><div class="label">Queue S</div><div class="kpi-val" id="kpi-qS">–</div></div>
    <div class="kpi-item"><div class="label">Queue E</div><div class="kpi-val" id="kpi-qE">–</div></div>
    <div class="kpi-item"><div class="label">Queue W</div><div class="kpi-val" id="kpi-qW">–</div></div>
    <div class="kpi-item"><div class="label">% Null Ctrl</div><div class="kpi-val" id="kpi-null">–</div></div>
    <div class="kpi-item"><div class="label">Algorithm</div><div class="kpi-val" id="kpi-algo" style="font-size:11px">–</div></div>
  </div></div>
  <div><h2>Legend</h2>
    <div style="font-size:10px;display:flex;flex-wrap:wrap;gap:6px">
      <span style="color:#3498db">■ Car</span>
      <span style="color:#f39c12">■ Bus</span>
      <span style="color:#e67e22">■ Truck</span>
      <span style="color:#9b59b6">● Pedestrian</span>
    </div>
  </div>
  <div><h2>Safety Log</h2><div id="log"></div></div>
</div>
<div id="main"><canvas id="canvas" width="900" height="900"></canvas></div>
<script>
const TOKEN="dev-token",API="";
let state=null,ws=null,speed=200,pollInterval=null;
const TURN_COLOR={left:"#ff6b6b",straight:"#4ecdc4",right:"#45b7d1"};
const VEHICLE_COLORS={car:"#3498db",bus:"#f39c12",truck:"#e67e22"};

const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;

const laneW=20;
const lanesPerSide=3;
const roadHalfW=lanesPerSide*laneW;
const roadW=roadHalfW*2;
const pedCrossingW=14;

// Vehicle dimensions: length along travel direction, width perpendicular
const VEHICLE_DIM={
  car:{len:16,wid:9,gap:20},
  bus:{len:32,wid:10,gap:36},
  truck:{len:26,wid:10,gap:30}
};

let crossingProgress={};

function drawRoads(){
  ctx.fillStyle="#1a4a1a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#2c3e50";
  ctx.fillRect(cx-roadHalfW,0,roadW,H);
  ctx.fillRect(0,cy-roadHalfW,W,roadW);
  ctx.fillStyle="#34495e";
  ctx.fillRect(cx-roadHalfW,cy-roadHalfW,roadW,roadW);

  // Center dividers
  ctx.strokeStyle="#f1c40f";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,cy-roadHalfW);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy+roadHalfW);ctx.lineTo(cx,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(cx-roadHalfW,cy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+roadHalfW,cy);ctx.lineTo(W,cy);ctx.stroke();

  // Lane dividers
  ctx.setLineDash([8,6]);ctx.strokeStyle="#ffffff40";ctx.lineWidth=1;
  for(let i=1;i<lanesPerSide;i++){
    const xL=cx-roadHalfW+i*laneW;
    ctx.beginPath();ctx.moveTo(xL,0);ctx.lineTo(xL,cy-roadHalfW);ctx.stroke();
    ctx.beginPath();ctx.moveTo(xL,cy+roadHalfW);ctx.lineTo(xL,H);ctx.stroke();
    const xR=cx+i*laneW;
    ctx.beginPath();ctx.moveTo(xR,0);ctx.lineTo(xR,cy-roadHalfW);ctx.stroke();
    ctx.beginPath();ctx.moveTo(xR,cy+roadHalfW);ctx.lineTo(xR,H);ctx.stroke();
  }
  for(let i=1;i<lanesPerSide;i++){
    const yT=cy-roadHalfW+i*laneW;
    ctx.beginPath();ctx.moveTo(0,yT);ctx.lineTo(cx-roadHalfW,yT);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+roadHalfW,yT);ctx.lineTo(W,yT);ctx.stroke();
    const yB=cy+i*laneW;
    ctx.beginPath();ctx.moveTo(0,yB);ctx.lineTo(cx-roadHalfW,yB);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+roadHalfW,yB);ctx.lineTo(W,yB);ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawPedestrianCrossings(st){
  const lights=st?st.lights:{};
  const stripeW=4,stripeGap=4;
  const arms=[
    {x:cx-roadHalfW, y:cy-roadHalfW-pedCrossingW, w:roadW, h:pedCrossingW, dir:"N", horiz:true},
    {x:cx-roadHalfW, y:cy+roadHalfW, w:roadW, h:pedCrossingW, dir:"S", horiz:true},
    {x:cx+roadHalfW, y:cy-roadHalfW, w:pedCrossingW, h:roadW, dir:"E", horiz:false},
    {x:cx-roadHalfW-pedCrossingW, y:cy-roadHalfW, w:pedCrossingW, h:roadW, dir:"W", horiz:false},
  ];
  arms.forEach(arm=>{
    const perpDirs={N:["E","W"],S:["E","W"],E:["N","S"],W:["N","S"]};
    const perpGreen=perpDirs[arm.dir].some(d=>{
      const info=lights[d];
      return info&&(info.phase==="green"||info.phase==="left_arrow"||info.phase==="right_arrow");
    });
    const pedGreen=!perpGreen;
    ctx.fillStyle=pedGreen?"#ffffffcc":"#ffffff44";
    if(arm.horiz){
      const n=Math.floor(arm.w/(stripeW+stripeGap));
      for(let i=0;i<n;i++) ctx.fillRect(arm.x+i*(stripeW+stripeGap),arm.y,stripeW,arm.h);
    }else{
      const n=Math.floor(arm.h/(stripeW+stripeGap));
      for(let i=0;i<n;i++) ctx.fillRect(arm.x,arm.y+i*(stripeW+stripeGap),arm.w,stripeW);
    }
    // Ped signal
    const sigX=arm.horiz?(arm.dir==="N"?arm.x-18:arm.x+arm.w+18):(arm.x+arm.w/2);
    const sigY=arm.horiz?(arm.y+arm.h/2):(arm.dir==="W"?arm.y-18:arm.y+arm.h+18);
    ctx.beginPath();ctx.arc(sigX,sigY,7,0,Math.PI*2);
    ctx.fillStyle=pedGreen?"#2ecc71":"#e74c3c";ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle="#fff";ctx.font="8px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(pedGreen?"🚶":"✋",sigX,sigY);
    if(pedGreen&&st&&st.tick) drawPedestrians(arm,st.tick);
  });
}

function drawPedestrians(arm,tick){
  ctx.fillStyle="#9b59b6";
  for(let i=0;i<4;i++){
    const phase=((tick*4+i*29)%100)/100;
    let px,py;
    if(arm.horiz){px=arm.x+phase*arm.w;py=arm.y+arm.h/2+(i%2===0?-3:3);}
    else{px=arm.x+arm.w/2+(i%2===0?-3:3);py=arm.y+phase*arm.h;}
    ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(px,py-4,1.5,0,Math.PI*2);ctx.fill();
  }
}

function drawStopLines(){
  ctx.strokeStyle="#fff";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx-roadHalfW,cy-roadHalfW-pedCrossingW);ctx.lineTo(cx,cy-roadHalfW-pedCrossingW);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy+roadHalfW+pedCrossingW);ctx.lineTo(cx+roadHalfW,cy+roadHalfW+pedCrossingW);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+roadHalfW+pedCrossingW,cy-roadHalfW);ctx.lineTo(cx+roadHalfW+pedCrossingW,cy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-roadHalfW-pedCrossingW,cy);ctx.lineTo(cx-roadHalfW-pedCrossingW,cy+roadHalfW);ctx.stroke();
}

function drawLaneArrows(){
  ctx.fillStyle="#ffffff55";ctx.font="11px monospace";ctx.textAlign="center";ctx.textBaseline="middle";
  const off=pedCrossingW+22;
  ctx.fillText("←",cx-roadHalfW+laneW*0.5,cy-roadHalfW-off);
  ctx.fillText("↓",cx-roadHalfW+laneW*1.5,cy-roadHalfW-off);
  ctx.fillText("→",cx-roadHalfW+laneW*2.5,cy-roadHalfW-off);
  ctx.fillStyle="#ffffff22";
  ctx.fillText("↑",cx+laneW*0.5,cy-roadHalfW-off);
  ctx.fillText("↑",cx+laneW*1.5,cy-roadHalfW-off);
  ctx.fillText("↑",cx+laneW*2.5,cy-roadHalfW-off);
  ctx.fillStyle="#ffffff55";
  ctx.fillText("→",cx+laneW*0.5,cy+roadHalfW+off);
  ctx.fillText("↑",cx+laneW*1.5,cy+roadHalfW+off);
  ctx.fillText("←",cx+laneW*2.5,cy+roadHalfW+off);
  ctx.fillStyle="#ffffff22";
  ctx.fillText("↓",cx-roadHalfW+laneW*0.5,cy+roadHalfW+off);
  ctx.fillText("↓",cx-roadHalfW+laneW*1.5,cy+roadHalfW+off);
  ctx.fillText("↓",cx-roadHalfW+laneW*2.5,cy+roadHalfW+off);
  ctx.fillStyle="#ffffff55";
  ctx.fillText("↑",cx+roadHalfW+off,cy-roadHalfW+laneW*0.5);
  ctx.fillText("←",cx+roadHalfW+off,cy-roadHalfW+laneW*1.5);
  ctx.fillText("↓",cx+roadHalfW+off,cy-roadHalfW+laneW*2.5);
  ctx.fillStyle="#ffffff22";
  ctx.fillText("→",cx+roadHalfW+off,cy+laneW*0.5);
  ctx.fillText("→",cx+roadHalfW+off,cy+laneW*1.5);
  ctx.fillText("→",cx+roadHalfW+off,cy+laneW*2.5);
  ctx.fillStyle="#ffffff55";
  ctx.fillText("↓",cx-roadHalfW-off,cy+laneW*0.5);
  ctx.fillText("→",cx-roadHalfW-off,cy+laneW*1.5);
  ctx.fillText("↑",cx-roadHalfW-off,cy+laneW*2.5);
  ctx.fillStyle="#ffffff22";
  ctx.fillText("←",cx-roadHalfW-off,cy-roadHalfW+laneW*0.5);
  ctx.fillText("←",cx-roadHalfW-off,cy-roadHalfW+laneW*1.5);
  ctx.fillText("←",cx-roadHalfW-off,cy-roadHalfW+laneW*2.5);
}

// Draw a realistic 3-light signal head (R/Y/G vertically) plus turn arrows
function drawSignalHead(x,y,phase,leftArrow,rightArrow,label,vertical){
  // Determine which lights are on
  const isRed=phase==="red";
  const isYellow=phase==="yellow";
  const isGreen=phase==="green"||phase==="left_arrow"||phase==="right_arrow";
  const isAmber=phase==="amber_flash";
  const flash=isAmber&&Math.floor(Date.now()/500)%2===0;

  // Signal housing (3 lights stacked)
  const lightR=6;
  const spacing=16;
  const houseW=18,houseH=52;

  ctx.save();
  ctx.translate(x,y);
  if(!vertical) ctx.rotate(Math.PI/2);

  // Housing background
  ctx.fillStyle="#111";
  ctx.beginPath();ctx.roundRect(-houseW/2,-houseH/2,houseW,houseH,3);ctx.fill();
  ctx.strokeStyle="#333";ctx.lineWidth=1;ctx.stroke();

  // Red light (top)
  ctx.beginPath();ctx.arc(0,-spacing,lightR,0,Math.PI*2);
  ctx.fillStyle=isRed?"#e74c3c":"#3a1111";ctx.fill();
  ctx.strokeStyle="#555";ctx.lineWidth=0.5;ctx.stroke();

  // Yellow light (middle)
  ctx.beginPath();ctx.arc(0,0,lightR,0,Math.PI*2);
  ctx.fillStyle=(isYellow||flash)?"#f39c12":(isAmber?"#3a2a00":"#3a2a00");ctx.fill();
  ctx.strokeStyle="#555";ctx.lineWidth=0.5;ctx.stroke();

  // Green light (bottom)
  ctx.beginPath();ctx.arc(0,spacing,lightR,0,Math.PI*2);
  ctx.fillStyle=isGreen?"#2ecc71":"#0a3a0a";ctx.fill();
  ctx.strokeStyle="#555";ctx.lineWidth=0.5;ctx.stroke();

  ctx.restore();

  // Turn arrow lights (positioned beside the main signal)
  const arrowOffset=vertical?16:16;

  // Left arrow light
  const leftOn=leftArrow==="left_arrow";
  const lax=vertical?x-arrowOffset:x;
  const lay=vertical?y+houseH/2+10:y-arrowOffset;
  ctx.beginPath();ctx.arc(lax,lay,5,0,Math.PI*2);
  ctx.fillStyle=leftOn?"#27ae60":"#0a2a0a";ctx.fill();
  ctx.strokeStyle="#333";ctx.lineWidth=0.5;ctx.stroke();
  if(leftOn){
    ctx.fillStyle="#fff";ctx.font="bold 7px monospace";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("←",lax,lay);
  }

  // Right arrow light
  const rightOn=rightArrow==="right_arrow";
  const rax=vertical?x+arrowOffset:x;
  const ray=vertical?y+houseH/2+10:y+arrowOffset;
  ctx.beginPath();ctx.arc(rax,ray,5,0,Math.PI*2);
  ctx.fillStyle=rightOn?"#27ae60":"#0a2a0a";ctx.fill();
  ctx.strokeStyle="#333";ctx.lineWidth=0.5;ctx.stroke();
  if(rightOn){
    ctx.fillStyle="#fff";ctx.font="bold 7px monospace";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("→",rax,ray);
  }

  // Direction label below signal
  ctx.fillStyle="#aaa";ctx.font="bold 9px monospace";ctx.textAlign="center";ctx.textBaseline="middle";
  const lblY=vertical?y-houseH/2-8:y;
  const lblX=vertical?x:x+houseH/2+8;
  ctx.fillText(label,lblX,lblY);
}

function drawLights(st){
  const lights=st.lights||{};
  // N signal: positioned at top-left of N incoming lanes
  const nInfo=lights["N"]||{};
  drawSignalHead(
    cx-roadHalfW-pedCrossingW-30, cy-roadHalfW-pedCrossingW-30,
    nInfo.phase||"red", nInfo.left_arrow||"", nInfo.right_arrow||"", "N", true
  );
  // S signal: positioned at bottom-right of S incoming lanes
  const sInfo=lights["S"]||{};
  drawSignalHead(
    cx+roadHalfW+pedCrossingW+30, cy+roadHalfW+pedCrossingW+30,
    sInfo.phase||"red", sInfo.left_arrow||"", sInfo.right_arrow||"", "S", true
  );
  // E signal: positioned at top-right
  const eInfo=lights["E"]||{};
  drawSignalHead(
    cx+roadHalfW+pedCrossingW+30, cy-roadHalfW-pedCrossingW-30,
    eInfo.phase||"red", eInfo.left_arrow||"", eInfo.right_arrow||"", "E", false
  );
  // W signal: positioned at bottom-left
  const wInfo=lights["W"]||{};
  drawSignalHead(
    cx-roadHalfW-pedCrossingW-30, cy+roadHalfW+pedCrossingW+30,
    wInfo.phase||"red", wInfo.left_arrow||"", wInfo.right_arrow||"", "W", false
  );
}

function getQueuedPos(v){
  const dim=VEHICLE_DIM[v.type]||VEHICLE_DIM.car;
  const laneIdx={left:0,middle:1,right:2}[v.lane]||1;
  const laneOff=(laneIdx+0.5)*laneW;
  const gap=dim.gap;
  const stopOff=pedCrossingW+dim.len/2+4;
  let x,y;
  switch(v.direction){
    case"N":x=cx-roadHalfW+laneOff;y=cy-roadHalfW-stopOff-v.queue_position*gap;break;
    case"S":x=cx+laneOff;y=cy+roadHalfW+stopOff+v.queue_position*gap;break;
    case"E":x=cx+roadHalfW+stopOff+v.queue_position*gap;y=cy-roadHalfW+laneOff;break;
    case"W":x=cx-roadHalfW-stopOff-v.queue_position*gap;y=cy+laneOff;break;
  }
  return {x,y};
}

function getExitPos(v){
  const turnToLane={left:2,straight:1,right:0};
  const outLane=(turnToLane[v.turn]||1);
  const laneOff=(outLane+0.5)*laneW;
  let x,y;
  switch(v.direction){
    case"N":
      if(v.turn==="straight"){x=cx+laneOff;y=cy+roadHalfW+50;}
      else if(v.turn==="left"){x=cx-roadHalfW-50;y=cy+laneOff;}
      else{x=cx+roadHalfW+50;y=cy-roadHalfW+laneOff;}
      break;
    case"S":
      if(v.turn==="straight"){x=cx-roadHalfW+laneOff;y=cy-roadHalfW-50;}
      else if(v.turn==="left"){x=cx+roadHalfW+50;y=cy-roadHalfW+laneOff;}
      else{x=cx-roadHalfW-50;y=cy+laneOff;}
      break;
    case"E":
      if(v.turn==="straight"){x=cx-roadHalfW-50;y=cy+laneOff;}
      else if(v.turn==="left"){x=cx+laneOff;y=cy+roadHalfW+50;}
      else{x=cx-roadHalfW+laneOff;y=cy-roadHalfW-50;}
      break;
    case"W":
      if(v.turn==="straight"){x=cx+roadHalfW+50;y=cy-roadHalfW+laneOff;}
      else if(v.turn==="left"){x=cx-roadHalfW+laneOff;y=cy-roadHalfW-50;}
      else{x=cx+laneOff;y=cy+roadHalfW+50;}
      break;
  }
  return {x,y};
}

// Get vehicle heading angle based on direction of travel
// Vehicles drawn with length along local X-axis; rotation orients them
// N incoming travels DOWN: angle=PI/2, S travels UP: angle=-PI/2
// E travels LEFT: angle=PI, W travels RIGHT: angle=0
function getTravelAngle(direction){
  switch(direction){
    case"N":return Math.PI/2;   // pointing down
    case"S":return -Math.PI/2;  // pointing up
    case"E":return Math.PI;     // pointing left
    case"W":return 0;           // pointing right
  }
  return 0;
}

function drawVehicleBody(x,y,v,angle){
  const dim=VEHICLE_DIM[v.type]||VEHICLE_DIM.car;
  const color=VEHICLE_COLORS[v.type]||"#3498db";
  const hl=dim.len/2, hw=dim.wid/2;

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);

  // Vehicle body drawn with length along X, width along Y
  if(v.type==="bus"){
    ctx.fillStyle=color;
    ctx.beginPath();ctx.roundRect(-hl,-hw,dim.len,dim.wid,2);ctx.fill();
    // Windows along top and bottom edges
    ctx.fillStyle="#2c3e50";
    for(let i=0;i<6;i++){
      ctx.fillRect(-hl+4+i*5,-hw+1,3,2);
      ctx.fillRect(-hl+4+i*5,hw-3,3,2);
    }
    // Front windshield
    ctx.fillStyle="#aaddff";
    ctx.fillRect(hl-4,-hw+1,3,dim.wid-2);
    // Rear
    ctx.fillStyle="#c0392b";
    ctx.fillRect(-hl,-hw+2,2,dim.wid-4);
  }else if(v.type==="truck"){
    // Cab at front
    ctx.fillStyle="#c0392b";
    ctx.beginPath();ctx.roundRect(hl-9,-hw,9,dim.wid,2);ctx.fill();
    // Windshield
    ctx.fillStyle="#aaddff";
    ctx.fillRect(hl-4,-hw+2,3,dim.wid-4);
    // Cargo body
    ctx.fillStyle=color;
    ctx.fillRect(-hl,-hw,dim.len-9,dim.wid);
    ctx.strokeStyle="#7f8c8d";ctx.lineWidth=0.5;
    ctx.strokeRect(-hl,-hw,dim.len-9,dim.wid);
  }else{
    // Car body
    ctx.fillStyle=color;
    ctx.beginPath();ctx.roundRect(-hl,-hw,dim.len,dim.wid,3);ctx.fill();
    // Windshield (front)
    ctx.fillStyle="#85c1e9";
    ctx.fillRect(hl-5,-hw+2,4,dim.wid-4);
    // Rear window
    ctx.fillStyle="#5dade2";
    ctx.fillRect(-hl+1,-hw+2,3,dim.wid-4);
    // Roof
    ctx.fillStyle=color;ctx.globalAlpha=0.7;
    ctx.fillRect(-hl+4,-hw+2,dim.len-9,dim.wid-4);
    ctx.globalAlpha=1;
  }

  // Turn indicator at front
  if(v.turn==="left"){
    ctx.fillStyle="#ff6b6b";
    ctx.beginPath();ctx.arc(hl-2,-hw-1,2,0,Math.PI*2);ctx.fill();
  }else if(v.turn==="right"){
    ctx.fillStyle="#45b7d1";
    ctx.beginPath();ctx.arc(hl-2,hw+1,2,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
}

function drawVehicles(st){
  const vehicles=st.vehicles||[];
  const crossing=st.crossing||[];

  const activeCrossing=new Set(crossing);
  for(const vid of Object.keys(crossingProgress)){
    if(!activeCrossing.has(vid)) delete crossingProgress[vid];
  }
  for(const vid of crossing){
    if(crossingProgress[vid]===undefined) crossingProgress[vid]=0;
    else crossingProgress[vid]=Math.min(1,crossingProgress[vid]+0.1);
  }

  // Draw queued vehicles
  vehicles.forEach(v=>{
    if(v.state==="queued"){
      const p=getQueuedPos(v);
      if(p.x<-60||p.x>W+60||p.y<-60||p.y>H+60) return;
      drawVehicleBody(p.x,p.y,v,getTravelAngle(v.direction));
    }
  });

  // Draw crossing vehicles animating through intersection
  vehicles.forEach(v=>{
    if(v.state==="crossing"){
      const progress=crossingProgress[v.vehicle_id]||0;
      const sp=getQueuedPos({...v,queue_position:0});
      let sx=sp.x,sy=sp.y;
      // Snap start to intersection edge
      switch(v.direction){
        case"N":sy=cy-roadHalfW;break;
        case"S":sy=cy+roadHalfW;break;
        case"E":sx=cx+roadHalfW;break;
        case"W":sx=cx-roadHalfW;break;
      }
      const ep=getExitPos(v);
      let px,py,angle=getTravelAngle(v.direction);

      if(v.turn==="straight"){
        // Linear path through intersection
        px=sx+(ep.x-sx)*progress;
        py=sy+(ep.y-sy)*progress;
      }else{
        // Quadratic Bezier curve for turning
        const cpx=cx,cpy=cy;
        const t=progress,mt=1-t;
        px=mt*mt*sx+2*mt*t*cpx+t*t*ep.x;
        py=mt*mt*sy+2*mt*t*cpy+t*t*ep.y;
        // Tangent angle for vehicle rotation
        const dx=2*mt*(cpx-sx)+2*t*(ep.x-cpx);
        const dy=2*mt*(cpy-sy)+2*t*(ep.y-cpy);
        angle=Math.atan2(dy,dx);
      }
      drawVehicleBody(px,py,v,angle);
    }
  });
}

function drawIntersection(st){
  ctx.clearRect(0,0,W,H);
  drawRoads();
  drawPedestrianCrossings(st);
  drawStopLines();
  drawLaneArrows();
  if(!st) return;
  drawLights(st);
  drawVehicles(st);
}

function render(){drawIntersection(state);requestAnimationFrame(render);}
render();

function updateKPI(st){
  document.getElementById("kpi-tick").textContent=st.tick??"–";
  document.getElementById("kpi-passed").textContent=st.kpi?.vehicles_passed??"–";
  document.getElementById("kpi-avgwait").textContent=st.kpi?st.kpi.avg_wait_ticks.toFixed(1):"–";
  document.getElementById("kpi-thr").textContent=st.kpi?st.kpi.throughput_per_100_ticks.toFixed(2):"–";
  document.getElementById("kpi-qN").textContent=st.queues?.N??"–";
  document.getElementById("kpi-qS").textContent=st.queues?.S??"–";
  document.getElementById("kpi-qE").textContent=st.queues?.E??"–";
  document.getElementById("kpi-qW").textContent=st.queues?.W??"–";
  document.getElementById("kpi-null").textContent=st.kpi?st.kpi.pct_null_control.toFixed(1)+"%":"–";
  document.getElementById("kpi-algo").textContent=st.algorithm??"–";
}
function appendLog(msg,isSafety){
  const log=document.getElementById("log"),div=document.createElement("div");
  div.textContent=msg;if(isSafety)div.classList.add("safety");
  log.appendChild(div);log.scrollTop=log.scrollHeight;
  if(log.children.length>100)log.removeChild(log.firstChild);
}

function connectWS(){
  const url=(location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/ws?token="+TOKEN;
  ws=new WebSocket(url);
  ws.onopen=()=>{document.getElementById("status").textContent="● Connected";document.getElementById("status").className="";if(pollInterval){clearInterval(pollInterval);pollInterval=null;}};
  ws.onclose=()=>{document.getElementById("status").textContent="● Polling";document.getElementById("status").className="stopped";setTimeout(connectWS,3000);startPolling();};
  ws.onmessage=(ev)=>{const msg=JSON.parse(ev.data);if(msg.event_type==="safety_override"){appendLog("[T"+msg.tick+"] SAFETY: "+((msg.payload||{}).explanation||(msg.payload||{}).rule),true);}else if(msg.event_type==="kpi_sample"){state={...state,kpi:msg.payload};}else if(msg.tick!==undefined){state=msg;updateKPI(msg);}};
  ws.onerror=()=>{};
}
function startPolling(){if(pollInterval)return;pollInterval=setInterval(async()=>{try{const r=await fetch(API+"/api/sim/state");if(r.ok){const s=await r.json();if(s.tick!==undefined){state=s;updateKPI(s);}}}catch(e){}},speed);}
function wsSend(obj){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(obj));}
async function apiPost(path,body){return(await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+TOKEN},body:JSON.stringify(body)})).json();}
async function loadAlgorithms(){const list=await fetch(API+"/api/algorithms").then(r=>r.json());const sel=document.getElementById("sel-algo");sel.innerHTML="";list.forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;sel.appendChild(o);});}

document.getElementById("btn-create").addEventListener("click",async()=>{const algo=document.getElementById("sel-algo").value;const seed=parseInt(document.getElementById("inp-seed").value)||42;const mt=document.getElementById("inp-maxticks").value;const r=await apiPost("/api/sim/create",{algorithm:algo,seed,max_ticks:mt?parseInt(mt):null});appendLog("Run created: "+r.run_id);});
document.getElementById("btn-start").addEventListener("click",async()=>{await apiPost("/api/sim/start",{});wsSend({action:"start"});startPolling();});
document.getElementById("btn-stop").addEventListener("click",async()=>{await apiPost("/api/sim/stop",{});wsSend({action:"stop"});});
document.getElementById("btn-reset").addEventListener("click",async()=>{await apiPost("/api/sim/reset",{});wsSend({action:"reset"});state=null;crossingProgress={};});
document.getElementById("btn-switch").addEventListener("click",async()=>{const algo=document.getElementById("sel-algo").value;await apiPost("/api/sim/switch_algorithm",{algorithm:algo});wsSend({action:"switch_algorithm",algorithm:algo});appendLog("Switching to: "+algo);});
document.getElementById("slider-speed").addEventListener("input",(e)=>{speed=parseInt(e.target.value);document.getElementById("speed-label").textContent=speed+"ms / tick";if(pollInterval){clearInterval(pollInterval);pollInterval=null;startPolling();}});

loadAlgorithms();connectWS();startPolling();
</script>
